{% load static %}<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% if owner %}{{ owner.user.first_name }} {{ owner.user.last_name }}{% else %}Portfolyo{% endif %}{% endblock %}</title>
    <meta name="description" content="{% block description %}Kişisel portfolyo ve tanıtım sitesi.{% endblock %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'main/css/fontawesome-all.min.css' %}">
    <link rel="stylesheet" href="{% static 'main/css/portfolio.css' %}">
</head>
<body>
    {% include "partials/nav.html" %}

    {% block rails %}{% endblock %}

    <main id="main">
        {% block content %}{% endblock %}
    </main>

    <script src="{% static 'main/js/portfolio.js' %}" defer></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
