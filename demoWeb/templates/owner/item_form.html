{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<section class="auth">
    <div class="auth__card">
        <h1>{{ title }} <span class="accent">Kaydet</span></h1>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.non_field_errors }}

            {% for field in form %}
                <div class="form-field">
                    {{ field.label_tag }}
                    {{ field }}
                    {{ field.errors }}
                </div>
            {% endfor %}

            <div class="form-actions">
                <button type="submit" class="btn btn--sm">Kaydet</button>
                <a class="link-muted" href="{% url 'item_list' model_name %}">Vazgeç</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
