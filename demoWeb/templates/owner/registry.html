{% extends "base.html" %}

{% block title %}Kayıt Ol{% endblock %}

{% block content %}
<section class="auth">
    <div class="auth__card">
        <h1>Sahip <span class="accent">Kaydı</span></h1>

        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}

            {% for field in form %}
                <div class="form-field">
                    {{ field.label_tag }}
                    {{ field }}
                    {{ field.errors }}
                </div>
            {% endfor %}

            <button type="submit" class="btn">Kayıt Ol</button>
        </form>
    </div>
</section>
{% endblock %}
