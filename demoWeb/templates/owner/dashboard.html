{% extends "base.html" %}

{% block title %}İçerik Yönetimi{% endblock %}

{% block content %}
<section class="auth">
    <div class="auth__card auth__card--wide">
        <div class="panel__head">
            <div>
                <h1>İçerik <span class="accent">Yönetimi</span></h1>
                <p class="panel__subtitle">Sitede görünen bölümleri buradan düzenleyin.</p>
            </div>
            <a class="link-muted" href="{% url 'owner_edit' %}">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                Profile Dön
            </a>
        </div>

        <div class="panel-grid">
            <a class="panel-card" href="{% url 'item_list' 'experience' %}">
                <span class="panel-card__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4a2 2 0 0 0-2 2v1H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3V6a2 2 0 0 0-2-2H9zm0 2h6v1H9V6z"/></svg></span>
                <span class="panel-card__title">Deneyimler</span>
            </a>
            <a class="panel-card" href="{% url 'item_list' 'project' %}">
                <span class="panel-card__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/></svg></span>
                <span class="panel-card__title">Projeler</span>
            </a>
            <a class="panel-card" href="{% url 'item_list' 'education' %}">
                <span class="panel-card__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg></span>
                <span class="panel-card__title">Eğitimler</span>
            </a>
            <a class="panel-card" href="{% url 'item_list' 'course' %}">
                <span class="panel-card__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a6 6 0 1 0 0 12A6 6 0 0 0 12 2zM8.5 14.6L7 22l5-2.2L17 22l-1.5-7.4A7.94 7.94 0 0 1 12 16a7.94 7.94 0 0 1-3.5-1.4z"/></svg></span>
                <span class="panel-card__title">Kurslar</span>
            </a>
            <a class="panel-card" href="{% url 'item_list' 'skill' %}">
                <span class="panel-card__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></span>
                <span class="panel-card__title">Yetenekler</span>
            </a>
            <a class="panel-card" href="{% url 'item_list' 'blog' %}">
                <span class="panel-card__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></span>
                <span class="panel-card__title">Blog Yazılarım</span>
            </a>
            <a class="panel-card" href="{% url 'item_list' 'contact' %}">
                <span class="panel-card__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7a5 5 0 0 0 0 10h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4a5 5 0 0 0 0-10z"/></svg></span>
                <span class="panel-card__title">İletişim Bağlantıları</span>
            </a>
        </div>

        <p class="auth__footer">
            <a class="link-muted" href="{% url 'home' %}">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3L2 12h3v8h6v-5h2v5h6v-8h3L12 3z"/></svg>
                Siteye Dön
            </a>
        </p>
    </div>
</section>
{% endblock %}
