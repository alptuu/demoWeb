{% extends "base.html" %}

{% block content %}
<form method="post">
    {% csrf_token %}
    <div>
        <label for="username">E-posta</label>
        <input type="text" name="username" id="username">
    </div>
    <div>
        <label for="password">Şifre</label>
        <input type="password" name="password" id="password">
    </div>
    <button type="submit">Giriş Yap</button>
</form>
{% endblock %}
