{% extends "base.html" %}

{% block title %}Profili Düzenle{% endblock %}

{% block content %}
<section class="auth">
    <div class="auth__card">
        <h1>Profili <span class="accent">Düzenle</span></h1>

        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}

            {% for field in form %}
                <div class="form-field">
                    {{ field.label_tag }}
                    {{ field }}
                    {{ field.errors }}
                </div>
            {% endfor %}

            <button type="submit" class="btn">Kaydet</button>
        </form>

        <p class="auth__footer"><a href="{% url 'owner_logout' %}">Çıkış Yap</a></p>
    </div>
</section>
{% endblock %}
