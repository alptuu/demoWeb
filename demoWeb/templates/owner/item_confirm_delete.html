{% extends "base.html" %}

{% block title %}{{ title }} Sil{% endblock %}

{% block content %}
<section class="auth">
    <div class="auth__card">
        <h1>{{ title }} <span class="accent">Sil</span></h1>

        <div class="danger-note">
            <p>“{{ item }}” kaydı kalıcı olarak silinecek. Bu işlem geri alınamaz.</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="form-actions">
                <button type="submit" class="btn btn--sm">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                    Evet, Sil
                </button>
                <a class="link-muted" href="{% url 'item_list' model_name %}">Vazgeç</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
