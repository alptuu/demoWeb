{% extends "base.html" %}

{% block title %}{{ title }} Sil{% endblock %}

{% block content %}
<section class="auth">
    <div class="auth__card">
        <h1>{{ title }} <span class="accent">Sil</span></h1>

        <p>"{{ item }}" kaydını silmek istediğinize emin misiniz?</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn">Evet, Sil</button>
        </form>
    </div>
</section>
{% endblock %}
