{% extends "base.html" %}

{% block title %}{{ project.title }}{% endblock %}

{% block content %}
<article class="detail">
    <div class="detail__progress"><span data-read-progress></span></div>

    <header class="detail__hero{% if not project.image %} detail__hero--plain{% endif %}" data-detail-hero>
        {% if project.image %}
            <div class="detail__hero-media" data-detail-parallax>
                <img src="{{ project.image.url }}" alt="{{ project.title }}">
            </div>
        {% endif %}

        <div class="detail__hero-inner" data-detail-fade>
            <p class="detail__eyebrow">Proje</p>
            <h1 class="detail__title">{{ project.title }}</h1>
        </div>

        <span class="detail__scroll-hint" data-detail-fade aria-hidden="true">
            <span class="detail__scroll-line"></span>
        </span>
    </header>

    <div class="detail__body">
        <div class="detail__content" data-stagger>
            {{ project.description|linebreaks }}
        </div>

        {% if project.url %}
            <p class="detail__cta reveal">
                <a class="btn" href="{{ project.url }}" target="_blank" rel="noopener">Projeyi gör</a>
            </p>
        {% endif %}

        <p class="detail__back reveal">
            <a href="{% url 'home' %}#projects">&larr; Projelere Dön</a>
        </p>
    </div>
</article>
{% endblock %}
