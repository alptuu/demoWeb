{% extends "base.html" %}

{% block title %}{{ project.title }}{% endblock %}

{% block content %}
<section class="section">
    <p class="section__label reveal">Proje</p>
    <h1 class="section__title reveal" data-delay="1">{{ project.title }}</h1>

    <p class="about__bio reveal" data-delay="2">{{ project.description|linebreaksbr }}</p>

    {% if project.url %}
        <p class="reveal" data-delay="3">
            <a class="project-card__link" href="{{ project.url }}" target="_blank" rel="noopener">Projeyi gör</a>
        </p>
    {% endif %}

    <p class="auth__footer"><a href="{% url 'home' %}#projects">Projelere Dön</a></p>
</section>
{% endblock %}
