{% extends "base.html" %}

{% block title %}{{ blog.title }}{% endblock %}

{% block content %}
<article class="detail">
    <div class="detail__progress"><span data-read-progress></span></div>

    <header class="detail__hero{% if not blog.image %} detail__hero--plain{% endif %}" data-detail-hero>
        {% if blog.image %}
            <div class="detail__hero-media" data-detail-parallax>
                <img src="{{ blog.image.url }}" alt="{{ blog.title }}">
            </div>
        {% endif %}

        <div class="detail__hero-inner" data-detail-fade>
            <p class="detail__eyebrow">
                Blog{% if blog.date %} <span class="detail__dot"></span> {{ blog.date|date:"d F Y" }}{% endif %}
            </p>
            <h1 class="detail__title">{{ blog.title }}</h1>
        </div>

        <span class="detail__scroll-hint" data-detail-fade aria-hidden="true">
            <span class="detail__scroll-line"></span>
        </span>
    </header>

    <div class="detail__body">
        <div class="detail__content" data-stagger>
            {{ blog.description|linebreaks }}
        </div>

        <p class="detail__back reveal">
            <a href="{% url 'home' %}#blog">&larr; Yazılara Dön</a>
        </p>
    </div>
</article>
{% endblock %}
